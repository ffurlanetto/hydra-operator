# Mirrors deploy/base/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-operator
  namespace: {{ include "hydra-operator.namespace" . }}
  labels:
    {{- include "hydra-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydra-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hydra-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HYDRA_URL
              value: {{ .Values.hydra.url | quote }}
            - name: HYDRA_CLUSTER_ID
              value: {{ .Values.hydra.clusterId | quote }}
            - name: HYDRA_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hydra-operator-registration
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
