log:
  level: info # trace|debug|info|warn|error|fatal
  format: json # json|console

hydra:
  url: "https://hydra.example.com"
  cluster_id: "" # ClusterRef ID, set after registration-token generation in the Hydra UI
  registration_token: "" # one-time token (HYDRA_REGISTRATION_TOKEN), only needed on first startup
  http_timeout: 30s

reconciler:
  sync_interval: 30s
  heartbeat_interval: 30s

capabilities:
  check_interval: 5m
  probe_timeout: 10s

metrics:
  port: 8080

operator:
  # Auto-detected from the in-cluster service account when running as a
  # pod; only set this explicitly for local development.
  namespace: ""
  token_secret_name: "hydra-operator-token"
  # Path to a kubeconfig file, used instead of the in-cluster config — for
  # local development against kind/k3d/CRC only. Empty uses in-cluster config.
  kubeconfig: ""
