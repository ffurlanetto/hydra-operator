apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No commonLabels here on purpose: Kustomize's commonLabels also patches the
# Deployment's spec.selector.matchLabels, which is immutable after creation.
# Every resource below already carries app.kubernetes.io/name: hydra-operator
# directly.

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - role.yaml
  - rolebinding.yaml
  - deployment.yaml
