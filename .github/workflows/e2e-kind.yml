name: E2E (envtest + kind)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  envtest:
    name: envtest (real API server, no controllers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Fetch kube-apiserver/etcd binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31.0 -p path)" >> "$GITHUB_ENV"

      # Not checked in — these change with every Knative release, see
      # docs/testing/e2e.md for why "latest" is used instead of a pinned tag.
      - name: Fetch Knative Serving CRDs
        run: |
          mkdir -p test/envtest/crds
          curl -fsSL -o test/envtest/crds/serving-crds.yaml \
            https://github.com/knative/serving/releases/latest/download/serving-crds.yaml

      # Pinned to the exact commit go.mod already requires for routev1/
      # route/clientset/versioned, so the CRD schema always matches the Go
      # types this repo compiles against (see Makefile's test-envtest target
      # for the same command — kept in sync).
      - name: Fetch OpenShift Route CRD
        run: |
          OPENSHIFT_API_COMMIT="$(go list -m -f '{{.Version}}' github.com/openshift/api | sed -E 's/.*-//')"
          curl -fsSL -o test/envtest/crds/route-crd.yaml \
            "https://raw.githubusercontent.com/openshift/api/${OPENSHIFT_API_COMMIT}/route/v1/zz_generated.crd-manifests/routes.crd.yaml"

      - name: Run envtest suite
        run: go test -tags envtest ./test/envtest/... -v -timeout 5m

  e2e-kind:
    name: e2e (real kind cluster + Knative + Kourier + Gatekeeper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: hydra-e2e
          wait: 120s

      - name: Install Knative Serving + Kourier
        run: |
          set -euo pipefail
          kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-crds.yaml
          kubectl wait --for=condition=Established --timeout=60s crd --all

          kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-core.yaml
          kubectl apply -f https://github.com/knative/net-kourier/releases/latest/download/kourier.yaml

          kubectl patch configmap/config-network \
            -n knative-serving \
            --type merge \
            -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

          kubectl -n knative-serving wait --for=condition=Available deployment --all --timeout=180s
          kubectl -n kourier-system wait --for=condition=Available deployment --all --timeout=180s

      # Pinned (not "latest"): PolicyReconciler's Rego bodies
      # (internal/reconciler/policy.go) are asserted here against a real
      # admission webhook's exact behavior — floating this URL would make an
      # upstream Gatekeeper release the thing that silently breaks this leg.
      # Keep this version in sync with scripts/e2e-local.sh's GATEKEEPER_VERSION.
      - name: Install OPA Gatekeeper
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/v3.23.0/deploy/gatekeeper.yaml
          kubectl wait --for=condition=Established --timeout=60s crd --all
          kubectl -n gatekeeper-system wait --for=condition=Available deployment --all --timeout=180s

          # Available doesn't mean the webhook's self-signed CA is patched into
          # the ValidatingWebhookConfiguration yet (a few seconds' lag after the
          # pod starts) — poll for it instead of a fixed sleep. The e2e test
          # itself also retries, so this is a best-effort head start.
          deadline=$((SECONDS + 120))
          until [[ -n "$(kubectl get validatingwebhookconfiguration gatekeeper-validating-webhook-configuration -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null)" ]]; do
            if [[ $SECONDS -ge $deadline ]]; then
              echo "gatekeeper webhook CA bundle not observed within 2m — continuing anyway, the e2e test retries"
              break
            fi
            sleep 3
          done

      - name: Export kubeconfig
        run: kind get kubeconfig --name hydra-e2e > "${{ runner.temp }}/kubeconfig"

      - name: Run e2e suite
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: go test -tags e2e ./test/e2e/... -v -timeout 20m
