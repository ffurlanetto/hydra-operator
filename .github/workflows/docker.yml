name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.repository_owner == 'ffurlanetto' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-package:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: scripts/chart-version.sh needs to detect
          # an exact tag match, which requires the tag objects to be
          # present (not guaranteed under the default shallow checkout).
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Compute version
        id: version
        run: |
          eval "$(scripts/chart-version.sh)"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm

      - name: Package chart
        run: |
          mkdir -p dist
          helm package ./helm --destination dist \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-operator-helm-chart
          path: dist/*.tgz
          retention-days: 7

      # Only real tag releases get pushed to the OCI registry — a plain
      # push to main only packages/lints as a build-health check, so main
      # builds never leave a trail of throwaway "dev" chart versions in
      # a registry meant for actual installable releases.
      - name: Push chart to GHCR
        if: ${{ github.repository_owner == 'ffurlanetto' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push "dist/hydra-operator-${{ steps.version.outputs.chart_version }}.tgz" oci://${{ env.REGISTRY }}/ffurlanetto/charts
